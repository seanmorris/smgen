name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use the v0.0.0 form: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: yaml, xmlwriter
          coverage: none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -o /tmp/yq
          echo '1bb99e1019e23de33c7e6afc23e93dad72aad6cf2cb03c797f068ea79814ddb0  /tmp/yq' | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/seanmorris/smgen-search/releases/download/v0.1.1/smgen-search-0.1.1.tgz -o /tmp/smgen-search.tgz
          echo '3ac43831bb223b823a8269b14e3582724b688619418ea3af8bec44578ff109a4  /tmp/smgen-search.tgz' | sha256sum -c -
          npm install --global /tmp/smgen-search.tgz

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run package checks
        run: npm run check

      - name: Inspect package archive
        run: npm pack --dry-run --ignore-scripts

      - name: Publish package
        run: npm publish --ignore-scripts --access public --provenance
