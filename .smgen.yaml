PRODUCT_NAME: SMGen
TAGLINE: Static Markup Generator
ORGANIZATION: Sean Morris
TITLE_PREFIX: SMGen

HEADER: templates/smgen-header.php

HIGHLIGHT_STYLE: zenburn

DEV_PORT: 8000

DEFAULT_THEME: theme-cosmic
STATIC_DIR: ./static

STYLES:
  - /default.css
  - /cosmic.css

DEFER_SCRIPTS:
  - /main.js
  - /nav-state.js
  - /search.js
  - /theme-variant.js

BODY_SCRIPTS:
  - /__smgen-assistant/loader.js

SEARCH_ENABLED: 1
SEARCH_READER: /vendor/smgen-search/SearchReader.mjs

LLMS:
  title: SMGen
  summary: Build static sites from Markdown with Pandoc, PHP templates, and Bash.
  details: |
    SMGen produces portable static files. Published sites do not require PHP
    or an application server.
  sections:
    start:
      title: Start Here
      weight: 0
    guides:
      title: Guides
      weight: 10
    reference:
      title: Reference
      weight: 20
    optional:
      title: Optional
      weight: 100

ICONS:
  - class: github-icon
    title: github
    href:  https://github.com/seanmorris/smgen
    text: null
    stc: null
